<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#0b1020"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>3D Snake</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0b1020;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  #scene{position:fixed;inset:0;display:block;}
  #hud{position:fixed;top:calc(10px + env(safe-area-inset-top));left:0;right:0;text-align:center;
    color:#e8ecff;font-size:15px;letter-spacing:.5px;pointer-events:none;text-shadow:0 1px 4px #000;z-index:5;}
  #hud b{color:#7dff9b;font-size:17px;}
  #hud .best{color:#8fa3d9;}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(8,12,28,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    color:#eef1ff;z-index:10;text-align:center;padding:20px;}
  #overlay h1{margin:0 0 6px;font-size:clamp(34px,9vw,56px);letter-spacing:2px;
    background:linear-gradient(90deg,#7dff9b,#4dd0ff);-webkit-background-clip:text;background-clip:text;color:transparent;}
  #overlay p{margin:6px 0;color:#aab6e8;font-size:15px;max-width:32ch;}
  #overlay .cta{margin-top:18px;padding:12px 28px;border-radius:999px;border:1px solid #4dd0ff66;
    color:#4dd0ff;font-size:16px;animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.06);opacity:.75}}
  .hidden{display:none !important;}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="hud"><b id="score">0</b> &nbsp;&middot;&nbsp; <span class="best">Rekord: <span id="best">0</span></span></div>
<div id="overlay">
  <h1 id="ovTitle">3D SNAKE</h1>
  <p id="ovMsg">Wische auf dem Bildschirm (oder Pfeiltasten) zum Steuern.</p>
  <p class="cta" id="ovCta">Tippen zum Starten</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

var GRID = 20, HALF = GRID / 2;
var canvas = document.getElementById('scene');
var renderer = new THREE.WebGLRenderer({canvas: canvas, antialias: true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1020);
scene.fog = new THREE.Fog(0x0b1020, 34, 80);

var camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);

scene.add(new THREE.AmbientLight(0x8899ff, 0.55));
var sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(8, 20, 6);
sun.castShadow = true;
sun.shadow.mapSize.width = 1024;
sun.shadow.mapSize.height = 1024;
sun.shadow.camera.left = -HALF - 2;
sun.shadow.camera.right = HALF + 2;
sun.shadow.camera.top = HALF + 2;
sun.shadow.camera.bottom = -HALF - 2;
sun.shadow.camera.far = 60;
scene.add(sun);

var boardTex = (function(){
  var c = document.createElement('canvas');
  c.width = c.height = 512;
  var g = c.getContext('2d');
  var s = 512 / GRID;
  for (var i = 0; i < GRID; i++) for (var j = 0; j < GRID; j++){
    g.fillStyle = ((i + j) % 2 === 0) ? '#131a33' : '#0f1529';
    g.fillRect(i * s, j * s, s, s);
  }
  return new THREE.CanvasTexture(c);
})();
var board = new THREE.Mesh(
  new THREE.PlaneGeometry(GRID, GRID),
  new THREE.MeshStandardMaterial({map: boardTex, roughness: 0.95, metalness: 0})
);
board.rotation.x = -Math.PI / 2;
board.receiveShadow = true;
scene.add(board);

var gridHelper = new THREE.GridHelper(GRID, GRID, 0x33477f, 0x1c2547);
gridHelper.position.y = 0.01;
gridHelper.material.transparent = true;
gridHelper.material.opacity = 0.5;
scene.add(gridHelper);

var wallMat = new THREE.MeshStandardMaterial({color: 0x220a12, emissive: 0xff2244, emissiveIntensity: 0.9});
[[0, -HALF - 0.5, GRID, 1], [0, HALF + 0.5, GRID, 1], [-HALF - 0.5, 0, 1, GRID], [HALF + 0.5, 0, 1, GRID]].forEach(function(w){
  var m = new THREE.Mesh(new THREE.BoxGeometry(w[2], 0.25, w[3]), wallMat);
  m.position.set(w[0], 0.12, w[1]);
  scene.add(m);
});

var food = new THREE.Mesh(
  new THREE.IcosahedronGeometry(0.38, 0),
  new THREE.MeshStandardMaterial({color: 0xff8c1a, emissive: 0xff5500, emissiveIntensity: 1.2, roughness: 0.3})
);
food.position.y = 0.5;
food.castShadow = true;
scene.add(food);
var foodLight = new THREE.PointLight(0xff7733, 1.1, 9);
scene.add(foodLight);

var segGeo = new THREE.BoxGeometry(0.86, 0.86, 0.86);
var headGeo = new THREE.BoxGeometry(0.9, 0.9, 1.1);
var headMat = new THREE.MeshStandardMaterial({color: 0x7dff9b, emissive: 0x1fae4f, emissiveIntensity: 0.55, roughness: 0.3});
var segments = [];

function ensureSegments(n){
  while (segments.length < n){
    var isHead = segments.length === 0;
    var m = new THREE.Mesh(isHead ? headGeo : segGeo, isHead ? headMat : new THREE.MeshStandardMaterial({roughness: 0.35, metalness: 0.1}));
    m.castShadow = true;
    scene.add(m);
    segments.push(m);
  }
}

var snake, prev, dir, dirQueue, foodPos, score, best, stepTime, running, started, dead;
best = parseInt(localStorage.getItem('snake3d_best') || '0', 10) || 0;

var overlay = document.getElementById('overlay');
var ovTitle = document.getElementById('ovTitle');
var ovMsg = document.getElementById('ovMsg');
var ovCta = document.getElementById('ovCta');

function updateHud(){
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = best;
}

function reset(){
  snake = [{x: -2, y: 0}, {x: -3, y: 0}, {x: -4, y: 0}];
  prev = snake.map(function(s){ return {x: s.x, y: s.y}; });
  dir = {x: 1, y: 0};
  dirQueue = [];
  score = 0;
  stepTime = 170;
  dead = false;
  while (segments.length > snake.length){
    scene.remove(segments.pop());
  }
  ensureSegments(snake.length);
  spawnFood();
  updateHud();
}

function spawnFood(){
  var free = [];
  for (var x = -HALF; x < HALF; x++) for (var y = -HALF; y < HALF; y++){
    if (!snake.some(function(s){ return s.x === x && s.y === y; })) free.push({x: x, y: y});
  }
  if (!free.length){ winGame(); return; }
  foodPos = free[Math.floor(Math.random() * free.length)];
  food.position.set(foodPos.x, 0.5, foodPos.y);
  foodLight.position.set(foodPos.x, 1.2, foodPos.y);
}

var actx = null;
function beep(freq, dur, delay, type, vol){
  try{
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    var t0 = actx.currentTime + (delay || 0);
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.12, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g);
    g.connect(actx.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.02);
  }catch(e){}
}

function step(){
  if (dirQueue.length) dir = dirQueue.shift();
  var head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (head.x < -HALF || head.x >= HALF || head.y < -HALF || head.y >= HALF) return gameOver();
  var eating = (head.x === foodPos.x && head.y === foodPos.y);
  var body = eating ? snake : snake.slice(0, snake.length - 1);
  for (var i = 0; i < body.length; i++){
    if (body[i].x === head.x && body[i].y === head.y) return gameOver();
  }
  prev = snake.map(function(s){ return {x: s.x, y: s.y}; });
  snake.unshift(head);
  if (eating){
    score += 10;
    stepTime = Math.max(70, stepTime - 4);
    beep(520, 0.09, 0, 'square', 0.08);
    beep(790, 0.12, 0.07, 'square', 0.08);
    spawnFood();
  } else {
    snake.pop();
  }
  while (prev.length < snake.length){
    prev.push({x: prev[prev.length - 1].x, y: prev[prev.length - 1].y});
  }
  ensureSegments(snake.length);
  updateHud();
}

function showOverlay(title, msg, cta){
  ovTitle.textContent = title;
  ovMsg.textContent = msg;
  ovCta.textContent = cta;
  overlay.classList.remove('hidden');
}

function gameOver(){
  dead = true;
  running = false;
  beep(220, 0.25, 0, 'sawtooth', 0.12);
  beep(140, 0.4, 0.18, 'sawtooth', 0.12);
  if (score > best){
    best = score;
    try{ localStorage.setItem('snake3d_best', String(best)); }catch(e){}
  }
  showOverlay('GAME OVER', 'Punkte: ' + score + '  ·  Rekord: ' + best, 'Tippen für Neustart');
  updateHud();
}

function winGame(){
  dead = true;
  running = false;
  showOverlay('GEWONN!', 'Du hast das ganze Brett gefüllt! Punkte: ' + score, 'Tippen für Neustart');
}

function start(){
  reset();
  running = true;
  started = true;
  overlay.classList.add('hidden');
  beep(660, 0.08, 0, 'sine', 0.1);
}

function handleTap(){
  if (!started || dead) start();
}

function queueDir(nd){
  var last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
  if (nd.x === last.x && nd.y === last.y) return;
  if (nd.x === -last.x && nd.y === -last.y) return;
  if (dirQueue.length < 3) dirQueue.push(nd);
}

var tsx = 0, tsy = 0;
window.addEventListener('touchstart', function(e){
  var t = e.changedTouches[0];
  tsx = t.clientX;
  tsy = t.clientY;
}, {passive: true});
window.addEventListener('touchmove', function(e){ e.preventDefault(); }, {passive: false});
window.addEventListener('touchend', function(e){
  var t = e.changedTouches[0];
  var dx = t.clientX - tsx, dy = t.clientY - tsy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24){ handleTap(); return; }
  queueDir(Math.abs(dx) > Math.abs(dy) ? {x: dx > 0 ? 1 : -1, y: 0} : {x: 0, y: dy > 0 ? 1 : -1});
});

window.addEventListener('keydown', function(e){
  var k = e.key, nd = null;
  if (k === 'ArrowUp' || k === 'w' || k === 'W') nd = {x: 0, y: -1};
  else if (k === 'ArrowDown' || k === 's' || k === 'S') nd = {x: 0, y: 1};
  else if (k === 'ArrowLeft' || k === 'a' || k === 'A') nd = {x: -1, y: 0};
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') nd = {x: 1, y: 0};
  if (nd){
    e.preventDefault();
    if (started && running) queueDir(nd);
  }
});

overlay.addEventListener('pointerdown', handleTap);
window.addEventListener('contextmenu', function(e){ e.preventDefault(); });

window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

var last = performance.now(), acc = 0, camX = 0, camZ = 0;
function animate(now){
  requestAnimationFrame(animate);
  var dt = Math.min(100, now - last);
  last = now;
  if (running){
    acc += dt;
    while (acc >= stepTime && running){
      step();
      acc -= stepTime;
    }
  }
  var t = running ? Math.min(1, acc / stepTime) : 1;
  for (var i = 0; i < segments.length; i++){
    var s = snake[i], p = prev[Math.min(i, prev.length - 1)];
    var mx = p.x + (s.x - p.x) * t;
    var mz = p.y + (s.y - p.y) * t;
    segments[i].position.set(mx, 0.45, mz);
    if (i > 0){
      var f = i / Math.max(1, snake.length - 1);
      segments[i].material.color.setHSL(0.36 - f * 0.10, 0.85, 0.55 - f * 0.25);
    }
  }
  if (segments.length) segments[0].rotation.y = Math.atan2(dir.x, dir.y);
  var pulse = 1 + Math.sin(now * 0.005) * 0.15;
  food.scale.set(pulse, pulse, pulse);
  food.rotation.y += dt * 0.003;
  camX += (snake[0].x * 0.35 - camX) * 0.04;
  camZ += (snake[0].y * 0.35 - camZ) * 0.04;
  camera.position.set(camX, 17, 13.5 + camZ);
  camera.lookAt(camX * 0.5, 0, camZ * 0.5 + 0.5);
  renderer.render(scene, camera);
}

reset();
running = false;
started = false;
updateHud();
requestAnimationFrame(animate);
})();
</script>
</body>
</html>
